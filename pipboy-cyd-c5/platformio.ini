; ============================================================================
;  PIP-BOY UI — NM-CYD-C5 (ESP32-C5, RISC-V, ST7789 320x240, XPT2046 touch)
;  PlatformIO project configuration
; ============================================================================
;  IMPORTANT: The ESP32-C5 is brand-new silicon (RISC-V, dual-band Wi-Fi 6).
;  Mainline platform-espressif32 support is still stabilizing, so this board
;  requires the pioarduino community fork below. Do NOT swap this for the
;  stock Espressif32 platform or the build will fail to find the C5 target.
; ============================================================================

[env:nm-cyd-c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino

; --- Serial ---
monitor_speed = 115200
upload_speed  = 460800

; --- Flash layout: 16MB flash / 8MB PSRAM on the NM-CYD-C5 ---
board_build.flash_mode = qio
board_build.psram      = enabled
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

; --- Libraries ---
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    PaulStoffregen/XPT2046_Touchscreen @ ^1.4

; --- Build flags: TFT_eSPI is configured entirely via defines here
;     instead of editing library files in-place, so the config survives
;     `pio lib update` and is reproducible from a clean checkout. ---
build_flags =
    -D USER_SETUP_LOADED=1

    ; ---- Panel driver ----
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1

    ; ---- Resolution (portrait native; UI drawn rotated to landscape) ----
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320

    ; ---- SPI pin map (NM-CYD-C5 official pinout: shared SPI bus) ----
    -D TFT_MISO=2
    -D TFT_MOSI=7
    -D TFT_SCLK=6
    -D TFT_CS=23
    -D TFT_DC=4          ; see note in README re: DC/RST — confirm against your
    -D TFT_RST=-1        ; unit's schematic; RST tied to EN on many CYD clones

    ; ---- Touch (XPT2046, shares SPI bus, own CS) ----
    -D TOUCH_CS=1

    ; ---- Fonts ----
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000

    ; ---- App-level pins (RGB LED status indicator on NM-CYD-C5) ----
    -D PIN_RGB_LED=8

monitor_filters = esp32_exception_decoder, colorize
